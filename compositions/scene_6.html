<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:1080px;height:1920px;margin:0;padding:0;overflow:hidden;background:#0a0a14;font-family:'Be Vietnam Pro',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1a1a2e 0%,#0a0a14 60%,#05050a 100%);color:#fff}
#particles-bg{position:absolute;inset:0;z-index:1;pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(247,181,0,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(247,181,0,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:2}
.txt{display:block;line-height:1.5;overflow:visible;padding-top:0.15em;padding-bottom:0.05em;letter-spacing:0.3px}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 55%,rgba(0,0,0,0.75));pointer-events:none;z-index:90}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,0.025) 0px,rgba(255,255,255,0.025) 2px,transparent 2px,transparent 4px);pointer-events:none;z-index:91}
.noise{position:absolute;inset:0;opacity:.07;pointer-events:none;z-index:92;background-image:url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSIzIi8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIyMDAiIGZpbHRlcj0idXJsKCNuKSIgb3BhY2l0eT0iMC42Ii8+PC9zdmc+')}
.progress{position:absolute;bottom:0;left:0;height:6px;background:linear-gradient(90deg,#F7B500,#FFD93D);width:0;z-index:99;box-shadow:0 0 20px #F7B500}
#content{position:absolute;inset:10px;overflow:visible;z-index:3;pointer-events:none}

/* Custom Styles */
.layer-far {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(193, 18, 31, 0.1) 0%, rgba(193, 18, 31, 0) 70%);
  filter: blur(80px);
  z-index: 0;
}
.layer-mid {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
}
.layer-near {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  align-items: center;
}

.play-button {
  width: 200px;
  height: 200px;
  background: #C1121F;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  box-shadow: 0 0 40px rgba(193, 18, 31, 0.7), 0 0 80px rgba(193, 18, 31, 0.4);
}
.play-button::before {
  content: '';
  position: absolute;
  width: 0;
  height: 0;
  border-top: 30px solid transparent;
  border-bottom: 30px solid transparent;
  border-left: 50px solid #fff;
  transform: translateX(10px);
}

.sound-wave {
  position: absolute;
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  opacity: 0;
}

.light-sweep {
  position: absolute;
  top: 0;
  left: -200%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  pointer-events: none;
  z-index: 50;
}

.text-block {
  position: absolute;
  top: 1000px; /* Adjusted for safe zone */
  width: 830px;
  text-align: center;
  font-size: 56px;
  font-weight: 800;
  color: #C1121F;
  text-shadow: 0 0 20px rgba(193, 18, 31, 0.5);
  left: 50%;
  transform: translateX(-50%);
}

.particle {
  position: absolute;
  background-color: rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  pointer-events: none;
}

.abstract-shape {
  position: absolute;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  filter: blur(5px);
  opacity: 0;
}


/* Vietnamese diacritics fix — prevent clipping */
#content{overflow:visible!important}
.hero-wrap,.hero-label,.hero-num,.hero-sub,
[class*="title"],[class*="label"],[class*="text"],[class*="heading"],
[class*="hero"],[class*="stat"],[class*="num"],[class*="keyword"]{
  overflow:visible!important;line-height:1.5!important;padding-top:0.15em!important;
}
</style></head><body>
<div id="stage">
  <div id="particles-bg"></div>
  <div class="grid-bg"></div>
  <div class="layer-far"></div>
  <div id="content">
    <div class="layer-mid">
      <div class="abstract-shape shape-1" style="width: 80px; height: 80px; top: 200px; left: 150px; transform: rotate(45deg);"></div>
      <div class="abstract-shape shape-2" style="width: 120px; height: 60px; top: 400px; right: 100px; transform: rotate(-30deg);"></div>
      <div class="abstract-shape shape-3" style="width: 70px; height: 70px; bottom: 300px; left: 200px; border-radius: 50%;"></div>
    </div>
    <div class="layer-near">
      <div class="play-button" id="playButton">
        <div class="sound-wave wave-1"></div>
        <div class="sound-wave wave-2"></div>
        <div class="sound-wave wave-3"></div>
      </div>
      <div class="light-sweep" id="lightSweep"></div>
    </div>
    <div class="text-block txt" id="keywordText"></div>
  </div>
  <div class="vignette"></div><div class="scan"></div><div class="noise"></div>
  <div class="progress" id="progress"></div>
</div>
<script>
gsap.registerPlugin(TextPlugin);

window.__timelines = window.__timelines || {};
var tl = gsap.timeline({ paused: true });
var DUR = 15000/1000;

tl.to('#progress',{width:1080,duration:DUR,ease:'none'},0);

// Camera movement (Slow zoom-in 4%)
tl.to('#stage', {
  scale: 1.04,
  duration: DUR,
  ease: 'none',
  transformOrigin: 'center center'
}, 0);

// Ambient motion for abstract shapes
var shapeCycles = Math.ceil(DUR / 5);
tl.to('.abstract-shape', {
  y: '+=30',
  x: 'random(-20, 20)',
  rotation: 'random(-10, 10)',
  duration: 5,
  repeat: shapeCycles - 1,
  yoyo: true,
  ease: 'sine.inOut'
}, 0);

// Particle generation (simple version)
function createParticle() {
  var particle = document.createElement('div');
  particle.className = 'particle';
  document.getElementById('particles-bg').appendChild(particle);

  var size = gsap.utils.random(5, 15);
  var startX = gsap.utils.random(0, 1080);
  var startY = gsap.utils.random(0, 1920);
  var endX = startX + gsap.utils.random(-100, 100);
  var endY = startY + gsap.utils.random(-200, -500);
  var duration = gsap.utils.random(5, 10);

  gsap.set(particle, {
    width: size,
    height: size,
    x: startX,
    y: startY,
    opacity: 0
  });

  gsap.to(particle, {
    duration: duration,
    x: endX,
    y: endY,
    opacity: 0.8,
    scale: 0.5,
    ease: 'power1.out',
    onComplete: () => {
      gsap.to(particle, {
        duration: duration * 0.5,
        opacity: 0,
        ease: 'power1.in',
        onComplete: () => particle.remove()
      });
    }
  });
}

// Generate particles continuously
var particleInterval = setInterval(createParticle, 200);
tl.call(() => clearInterval(particleInterval), [], DUR); // Stop generating at end

// Beat 1 [t = 0.000s to 9.000s]
var beat1Start = 0.1; // Offset animation start
var beat1Duration = 9.000;

// HOOK: Glitch effect (simulated)
tl.to('#stage', {
  filter: 'brightness(1.5) contrast(1.2)',
  duration: 0.1,
  ease: 'steps(1)',
  yoyo: true,
  repeat: 1
}, beat1Start);
tl.to('#stage', {
  x: 'random(-5, 5)',
  y: 'random(-5, 5)',
  duration: 0.1,
  ease: 'steps(1)',
  yoyo: true,
  repeat: 1
}, beat1Start);

// BUILD: Play button scales up with elastic bounce
tl.fromTo('#playButton', {
  scale: 0,
  opacity: 0,
  y: 50
}, {
  scale: 1,
  opacity: 1,
  y: 0,
  duration: 0.8,
  ease: 'elastic.out(1, 0.75)'
}, beat1Start + 0.2);

// Abstract shapes entry
tl.fromTo('.abstract-shape', {
  opacity: 0,
  scale: 0.5,
  rotation: 'random(-90, 90)'
}, {
  opacity: 0.3,
  scale: 1,
  rotation: 0,
  duration: 0.6,
  ease: 'power3.out',
  stagger: 0.1
}, beat1Start + 0.4);

// IMPACT: Sound waves pulse outwards
tl.to('.wave-1', {
  scale: 1.5,
  opacity: 0,
  duration: 1.5,
  ease: 'power2.out',
  repeat: Math.ceil(DUR / 1.5) - 1,
  delay: 0.2
}, beat1Start + 0.8);
tl.to('.wave-2', {
  scale: 2.0,
  opacity: 0,
  duration: 1.5,
  ease: 'power2.out',
  repeat: Math.ceil(DUR / 1.5) - 1,
  delay: 0.4
}, beat1Start + 0.8);
tl.to('.wave-3', {
  scale: 2.5,
  opacity: 0,
  duration: 1.5,
  ease: 'power2.out',
  repeat: Math.ceil(DUR / 1.5) - 1,
  delay: 0.6
}, beat1Start + 0.8);

// REVEAL: Keyword text
tl.fromTo('#keywordText', {
  opacity: 0,
  y: 20,
  letterSpacing: '1em'
}, {
  opacity: 1,
  y: 0,
  letterSpacing: '0.3px',
  duration: 0.6,
  ease: 'power3.out',
  text: {
    value: "TRẢI NGHIỆM ĐỘC ĐÁO",
    speed: 0.05
  }
}, beat1Start + 1.2);

// Lighting effect: Light sweep
tl.fromTo('#lightSweep', {
  x: '-100%'
}, {
  x: '200%',
  duration: 1.5,
  ease: 'power1.inOut',
  repeat: Math.ceil(DUR / 3) - 1,
  delay: 0.5
}, beat1Start);

// Climax Loop (from 0.000s until end of scene at 15.000s)
// Play button subtle pulse
tl.to('#playButton', {
  scale: 1.02,
  boxShadow: '0 0 50px rgba(193, 18, 31, 0.9), 0 0 100px rgba(193, 18, 31, 0.6)',
  duration: 2,
  repeat: Math.ceil(DUR / 2) - 1,
  yoyo: true,
  ease: 'sine.inOut'
}, 0);

// Keyword text subtle glow pulse
tl.to('#keywordText', {
  textShadow: '0 0 30px rgba(193, 18, 31, 0.8), 0 0 60px rgba(193, 18, 31, 0.5)',
