.layer-mid {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: radial-gradient(circle at 50% 50%, rgba(0,102,255,0.1) 0%, transparent 70%);
}

.layer-near {
    position: absolute;
    inset: 0;
    z-index: 30;
}

.car-icon {
    position: absolute;
    width: 180px;
    height: 100px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 40;
    filter: drop-shadow(0 0 15px rgba(0,102,255,0.8));
}

.car-icon svg {
    width: 100%;
    height: 100%;
    fill: #0066FF;
}

.car-path {
    position: absolute;
    width: 800px;
    height: 10px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, transparent, #0066FF, transparent);
    opacity: 0.6;
    filter: blur(5px);
    z-index: 35;
}

.data-point {
    position: absolute;
    width: 8px;
    height: 8px;
    background-color: #FFD93D;
    border-radius: 50%;
    opacity: 0;
    z-index: 36;
    filter: drop-shadow(0 0 5px #FFD93D);
}

.light-trail {
    position: absolute;
    height: 6px;
    width: 0;
    background: linear-gradient(90deg, transparent, #FF0000, #0000FF, transparent);
    opacity: 0.7;
    filter: blur(3px);
    z-index: 38;
}

.text-block {
    position: absolute;
    width: 830px;
    left: 50%;
    top: 1000px; /* Adjust based on safe zone */
    transform: translateX(-50%);
    text-align: center;
    font-size: 64px;
    font-weight: 800;
    color: #F7B500;
    text-shadow: 0 0 30px #F7B500, 0 0 60px rgba(247,181,0,0.6);
    z-index: 50;
    opacity: 0;
}

.text-block span {
    display: inline-block;
    white-space: nowrap;
}

.keyword {
    color: #0066FF;
    text-shadow: 0 0 20px #0066FF, 0 0 40px rgba(0,102,255,0.6);
}

.street-light-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0;
    z-index: 15;
}
