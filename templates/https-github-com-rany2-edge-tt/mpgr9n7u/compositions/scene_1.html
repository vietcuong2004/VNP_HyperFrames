    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      padding: 0;
      overflow: hidden;

      font-family: 'Be Vietnam Pro', Arial, Helvetica, sans-serif;

    #stage {

      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #0d0d1b 0%, #05050a 80%, #020205 100%);
      color: #fff;
    }
    
    /* Background grid */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      background-position: center center;
      pointer-events: none;
      z-index: 2;
      opacity: 0.8;
    }
    
    /* Vignette and scanlines */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 90;
    }
    .scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 4px);
      pointer-events: none;
      z-index: 91;

    .progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      background: linear-gradient(90deg, #F7B500, #FFD93D);
      width: 0;
      z-index: 99;
      box-shadow: 0 0 20px #F7B500;
    }
    
    #content {
      position: absolute;
      inset: 0;
      overflow: visible;
      z-index: 10;
    }

      position: absolute;

      left: 50%;
