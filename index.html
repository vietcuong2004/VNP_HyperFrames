<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #05050a;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      border: none;
      visibility: hidden;
      opacity: 0;
      z-index: 10;
    }
    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 8px;
      background: linear-gradient(90deg, #F7B500, #FFD93D);
      width: 0%;
      z-index: 999;
      box-shadow: 0 0 20px #F7B500;
    }
  </style>
  <script src="./vendor/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="agent-composition" data-duration="47.520" data-width="1080" data-height="1920" data-start="0">
    <!-- Background Music -->
    <audio id="bg-audio" src="./assets/background-music/futuristic electronic digital technology data modern background.mp3" data-track-index="0" data-start="0" data-duration="47.520" data-volume="0.12" loop></audio>

    <!-- TTS Audio Tracks & SFX -->
    <audio id="tts-scene1" src="./assets/audio/scene_1.mp3" data-track-index="1" data-start="0.000" data-duration="10.680" data-volume="1.0"></audio>
    <audio id="tts-scene2" src="./assets/audio/scene_2.mp3" data-track-index="1" data-start="10.680" data-duration="11.352" data-volume="1.0"></audio>
    <audio id="tts-scene3" src="./assets/audio/scene_3.mp3" data-track-index="1" data-start="22.032" data-duration="11.184" data-volume="1.0"></audio>
    <audio id="tts-scene4" src="./assets/audio/scene_4.mp3" data-track-index="1" data-start="33.216" data-duration="14.304" data-volume="1.0"></audio>
    <audio id="sfx-0" src="./assets/sound-effect/transition 3.mp3" data-track-index="2" data-start="0.500" data-duration="1.5" data-volume="0.75"></audio>
    <audio id="sfx-1" src="./assets/sound-effect/Clicks_Clanks_54.wav" data-track-index="2" data-start="5.000" data-duration="1.5" data-volume="0.70"></audio>
    <audio id="sfx-2" src="./assets/sound-effect/Mouse Click Sound Effect.mp3" data-track-index="2" data-start="10.500" data-duration="1.5" data-volume="0.80"></audio>
    <audio id="sfx-3" src="./assets/sound-effect/Clicks_Clanks_67.wav" data-track-index="2" data-start="15.000" data-duration="1.5" data-volume="0.70"></audio>
    <audio id="sfx-4" src="./assets/sound-effect/transition 5.mp3" data-track-index="2" data-start="20.000" data-duration="1.5" data-volume="0.75"></audio>
    <audio id="sfx-5" src="./assets/sound-effect/Clicks_Clanks_82.wav" data-track-index="2" data-start="24.000" data-duration="1.5" data-volume="0.70"></audio>
    <audio id="sfx-6" src="./assets/sound-effect/window start.mp3" data-track-index="2" data-start="28.000" data-duration="1.5" data-volume="0.80"></audio>
    <audio id="sfx-7" src="./assets/sound-effect/transition 7.mp3" data-track-index="2" data-start="32.000" data-duration="1.5" data-volume="0.75"></audio>
    <audio id="sfx-8" src="./assets/sound-effect/Ding 2.mp3" data-track-index="2" data-start="37.000" data-duration="1.5" data-volume="0.85"></audio>

    <!-- Compositions Iframes -->
    <iframe id="iframe-scene1" src="./compositions/scene_1.html"></iframe>
    <iframe id="iframe-scene2" src="./compositions/scene_2.html"></iframe>
    <iframe id="iframe-scene3" src="./compositions/scene_3.html"></iframe>
    <iframe id="iframe-scene4" src="./compositions/scene_4.html"></iframe>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progress"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var DUR = 47.520;
    
    // Animate progress bar
    tl.to('#progress', { width: '1080px', duration: DUR, ease: 'none' }, 0);

    // Sync iframes with parent timeline

    // Canh 1
    tl.set("#iframe-scene1", { visibility: "visible", opacity: 1 }, 0.000);
    tl.to({ progress: 0 }, {
      progress: 1,
      duration: 10.680,
      ease: "none",
      onUpdate: function() {
        const iframe = document.getElementById("iframe-scene1");
        if (iframe && iframe.contentWindow && iframe.contentWindow.__timelines && iframe.contentWindow.__timelines["main"]) {
          iframe.contentWindow.__timelines["main"].progress(this.targets()[0].progress);
        }
      }
    }, 0.000);
        tl.to("#iframe-scene1", { opacity: 0, duration: 0.15 }, 10.530);
    tl.set("#iframe-scene1", { visibility: "hidden" }, 10.680);

    // Canh 2
    tl.set("#iframe-scene2", { visibility: "visible", opacity: 1 }, 10.680);
    tl.to({ progress: 0 }, {
      progress: 1,
      duration: 11.352,
      ease: "none",
      onUpdate: function() {
        const iframe = document.getElementById("iframe-scene2");
        if (iframe && iframe.contentWindow && iframe.contentWindow.__timelines && iframe.contentWindow.__timelines["main"]) {
          iframe.contentWindow.__timelines["main"].progress(this.targets()[0].progress);
        }
      }
    }, 10.680);
        tl.to("#iframe-scene2", { opacity: 0, duration: 0.15 }, 21.882);
    tl.set("#iframe-scene2", { visibility: "hidden" }, 22.032);

    // Canh 3
    tl.set("#iframe-scene3", { visibility: "visible", opacity: 1 }, 22.032);
    tl.to({ progress: 0 }, {
      progress: 1,
      duration: 11.184,
      ease: "none",
      onUpdate: function() {
        const iframe = document.getElementById("iframe-scene3");
        if (iframe && iframe.contentWindow && iframe.contentWindow.__timelines && iframe.contentWindow.__timelines["main"]) {
          iframe.contentWindow.__timelines["main"].progress(this.targets()[0].progress);
        }
      }
    }, 22.032);
        tl.to("#iframe-scene3", { opacity: 0, duration: 0.15 }, 33.066);
    tl.set("#iframe-scene3", { visibility: "hidden" }, 33.216);

    // Canh 4
    tl.set("#iframe-scene4", { visibility: "visible", opacity: 1 }, 33.216);
    tl.to({ progress: 0 }, {
      progress: 1,
      duration: 14.304,
      ease: "none",
      onUpdate: function() {
        const iframe = document.getElementById("iframe-scene4");
        if (iframe && iframe.contentWindow && iframe.contentWindow.__timelines && iframe.contentWindow.__timelines["main"]) {
          iframe.contentWindow.__timelines["main"].progress(this.targets()[0].progress);
        }
      }
    }, 33.216);
    
    window.__timelines["agent-composition"] = tl;
  </script>
</body>
</html>
