<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/TextPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.12.0/tsparticles.slim.bundle.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:1080px;height:1920px;margin:0;padding:0;overflow:hidden;background:#1e293b;font-family:'Be Vietnam Pro',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1a1a2e 0%,#0f172a 60%,#1e293b 100%);color:#fff}
#particles-bg{position:absolute;inset:0;z-index:1;pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(247,181,0,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(247,181,0,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:2}
.txt{display:block;line-height:1.5;overflow:visible;padding-top:0.15em;padding-bottom:0.05em;letter-spacing:0.3px}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 55%,rgba(0,0,0,0.75));pointer-events:none;z-index:90}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,0.025) 0px,rgba(255,255,255,0.025) 2px,transparent 2px,transparent 4px);pointer-events:none;z-index:91}
.noise{position:absolute;inset:0;opacity:.07;pointer-events:none;z-index:92;background-image:url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC45IiBudW1PY3RhdmVzPSIzIi8+PC9mZmlsdGVyPjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiBmaWx0ZXI9InVybCgjbikiIG9wYWNpdHk9IjAuNiIvPjwvc3ZnPg==')}
.progress{position:absolute;bottom:0;left:0;height:6px;background:linear-gradient(90deg,#F7B500,#FFD93D);width:0;z-index:99;box-shadow:0 0 20px #F7B500}
#content{position:absolute;inset:10px;overflow:visible;z-index:3;pointer-events:none}

/* Custom Styles */
.layer-far { z-index: 10; }
.layer-mid { z-index: 20; }
.layer-near { z-index: 30; }

.globe-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 810px; /* HERO_MAX_W */
  height: 810px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.globe-icon {
  width: 100%;
  height: 100%;
  position: relative;
  filter: drop-shadow(0 0 20px rgba(247, 181, 0, 0.5)) drop-shadow(0 0 40px rgba(247, 181, 0, 0.3));
}

.globe-base {
  position: absolute;
  width: 80%;
  height: 80%;
  border-radius: 50%;
  background: radial-gradient(circle at center, #0066FF 0%, #0033AA 70%, transparent 100%);
  opacity: 0.8;
  transform: scale(0);
}

.neural-network {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.neural-line {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
}

.neural-node {
  position: absolute;
  width: 12px;
  height: 12px;
  background-color: #FFD93D;
  border-radius: 50%;
  box-shadow: 0 0 10px #FFD93D, 0 0 20px #FFD93D80;
  opacity: 0;
}

.light-sweep {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.1) 50%, transparent 100%);
  transform: translateX(-100%);
  opacity: 0;
}

.text-overlay {
  position: absolute;
  top: 100px; /* TOP_PADDING */
  left: 50%;
  transform: translateX(-50%);
  width: 830px; /* TEXT_MAX_W */
  text-align: center;
  font-family: 'Be Vietnam Pro', sans-serif;
  color: #F7B500; /* Primary color */
  font-weight: 800;
  font-size: 72px; /* Title */
  text-shadow: 0 0 30px #F7B500, 0 0 60px #F7B50060;
  opacity: 0;
}

.text-label {
  position: absolute;
  bottom: 130px; /* BOTTOM_PADDING */
  left: 50%;
  transform: translateX(-50%);
  width: 830px; /* TEXT_MAX_W */
  text-align: center;
  font-family: 'Be Vietnam Pro', sans-serif;
  color: #ffffff;
  font-weight: 600;
  font-size: 48px; /* Subtitle */
  opacity: 0;
}

.light-streak {
  position: absolute;
  width: 200px;
  height: 5px;
  background: linear-gradient(90deg, transparent, #FFD93D, transparent);
  opacity: 0;
  filter: blur(2px);
}

#tsparticles {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 5;
  pointer-events: none;
}


/* Vietnamese diacritics fix — prevent clipping */
#content{overflow:visible!important}
.hero-wrap,.hero-label,.hero-num,.hero-sub,
[class*="title"],[class*="label"],[class*="text"],[class*="heading"],
[class*="hero"],[class*="stat"],[class*="num"],[class*="keyword"]{
  overflow:visible!important;line-height:1.5!important;padding-top:0.15em!important;
}
</style></head><body>
<div id="stage">
  <div id="particles-bg"></div>
  <div class="grid-bg"></div>
  <div id="tsparticles"></div>
  <div id="content">
    <!-- Far Layer: Abstract geometric patterns -->
    <div class="layer-far" style="position:absolute; inset:0; background-image:url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTA4MCIgaGVpZ2h0PSIxOTIwIiB2aWV3Qm94PSIwIDAgMTA4MCAxOTIwIiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxwYXRoIGQ9Ik01NDAgMEw1OTAgMTkwTDEwODAgNDcwTDU0MCAxOTIwTDAgNDcwTDU0MCAxOTBaIiBzdHJva2U9InVybCgjZ3JhZGllbnQpIiBzdHJva2Utd2lkdGg9IjIiIG9wYWNpdHk9IjAuMSIvPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0iZ3JhZGllbnQiIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiMwMDY2RkYiLz48c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiNGRkQ5M0QiLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48L3N2Zz4='); background-size:cover; opacity:0.3;"></div>

    <!-- Mid Layer: Interconnected glowing lines -->
    <div class="layer-mid globe-container">
      <div class="globe-icon">
        <div class="globe-base" id="globeBase"></div>
        <div class="neural-network">
          <div class="neural-line" style="width: 60%; height: 60%; transform: rotate(0deg);" id="neuralLine1"></div>
          <div class="neural-line" style="width: 80%; height: 80%; transform: rotate(45deg);" id="neuralLine2"></div>
          <div class="neural-line" style="width: 100%; height: 100%; transform: rotate(90deg);" id="neuralLine3"></div>
          <div class="neural-node" style="top: 10%; left: 20%;" id="node1"></div>
          <div class="neural-node" style="top: 30%; right: 15%;" id="node2"></div>
          <div class="neural-node" style="bottom: 20%; left: 25%;" id="node3"></div>
          <div class="neural-node" style="bottom: 10%; right: 30%;" id="node4"></div>
        </div>
      </div>
    </div>

    <!-- Near Layer: Light streaks & Text -->
    <div class="layer-near">
      <div class="light-streak" style="top: 20%; left: -100px;" id="streak1"></div>
      <div class="light-streak" style="top: 50%; right: -100px;" id="streak2"></div>
      <div class="light-streak" style="bottom: 20%; left: -100px;" id="streak3"></div>
      <div class="text-overlay txt" id="mainText">TƯƠNG LAI AI</div>
      <div class="text-label txt" id="subLabel">KỶ NGUYÊN MỚI</div>
    </div>
  </div>
  <div class="vignette"></div><div class="scan"></div><div class="noise"></div>
  <div class="progress" id="progress"></div>
</div>
<script>
gsap.registerPlugin(TextPlugin);

// tsParticles setup

    number: { value: 80, density: { enable: true, area: 800 } },

    shape: { type: "circle" },
    opacity: { value: 0.5, random: true, anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false } },

      speed: 1,
      direction: "none",
      random: true,
      straight: false,
      out_mode: "out",
      bounce: false,
      attract: { enable: false, rotateX: 600, rotateY: 1200 }

    detect_on: "canvas",

  },
  retina_detect: true
});

  scale: 1.04,
  duration: DUR,
  ease: 'none',
  transformOrigin: 'center center'
