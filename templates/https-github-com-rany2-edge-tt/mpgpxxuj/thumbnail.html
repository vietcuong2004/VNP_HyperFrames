<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0a14}
body{color:#fff;font-family:'Be Vietnam Pro',sans-serif}
.txt{display:block;line-height:1.5;overflow:visible;padding-top:0.15em;padding-bottom:0.05em}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1a0f3e,#0a0a14)}
#content{position:absolute;inset:0;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:#a78bfa;border-radius:50%;opacity:0.6;box-shadow:0 0 10px #a78bfa}
.glow-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.4}
#mic-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;display:flex;align-items:center;justify-content:center}
.mic-glow{position:absolute;width:100%;height:100%;background:radial-gradient(circle,#8b5cf6,transparent 70%);opacity:0.6;border-radius:50%;filter:blur(40px)}
.mic-icon{position:relative;width:180px;height:240px;background:linear-gradient(135deg,#a78bfa,#8b5cf6);border-radius:80px 80px 20px 20px;box-shadow:0 20px 60px rgba(139,92,246,0.6),inset 0 -10px 30px rgba(0,0,0,0.3)}
.mic-icon::before{content:'';position:absolute;top:20px;left:50%;transform:translateX(-50%);width:80px;height:120px;background:linear-gradient(180deg,#1a0f3e,#0a0a14);border-radius:40px;box-shadow:inset 0 4px 10px rgba(0,0,0,0.5)}
.mic-icon::after{content:'';position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);width:100px;height:50px;background:linear-gradient(135deg,#a78bfa,#8b5cf6);border-radius:0 0 50px 50px;box-shadow:0 10px 30px rgba(139,92,246,0.4)}
.wave{position:absolute;border:3px solid;border-radius:50%;opacity:0.4}
.wave1{width:500px;height:500px;border-color:#8b5cf6;top:50%;left:50%;transform:translate(-50%,-50%)}
.wave2{width:620px;height:620px;border-color:#a78bfa;top:50%;left:50%;transform:translate(-50%,-50%)}
.wave3{width:740px;height:740px;border-color:#c4b5fd;top:50%;left:50%;transform:translate(-50%,-50%)}
.logo-badge{position:absolute;width:100px;height:100px;background:rgba(10,10,20,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #8b5cf6;box-shadow:0 8px 24px rgba(139,92,246,0.4)}
.logo-badge img{width:60px;height:60px;object-fit:contain}
#python-logo{top:45%;left:12%}
#edge-logo{top:45%;right:12%}
#title{position:absolute;top:180px;left:50%;transform:translateX(-50%);width:900px;text-align:center}
#title h1{font-size:88px;font-weight:800;background:linear-gradient(135deg,#fff,#e0e7ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(255,255,255,0.3);letter-spacing:-1px;margin:0}
#badge{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#8b5cf6,#6366f1);padding:16px 48px;border-radius:50px;box-shadow:0 8px 32px rgba(139,92,246,0.6),inset 0 2px 8px rgba(255,255,255,0.2)}
#badge span{font-size:36px;font-weight:700;color:#fff;letter-spacing:1px}
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');
</style></head><body>
